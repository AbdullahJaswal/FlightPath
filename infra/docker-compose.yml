name: flightpath

services:
  web:
    build:
      context: ../web
    environment:
      API_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../web
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ../web/package.json
        - action: rebuild
          path: ../web/pnpm-lock.yaml

  api:
    build:
      context: ../api
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://flightpath:flightpath@postgres:5432/flightpath?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: rebuild
          path: ../api
          ignore:
            - "**/*_test.go"

  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: flightpath
      POSTGRES_PASSWORD: flightpath
      POSTGRES_DB: flightpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightpath -d flightpath"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
