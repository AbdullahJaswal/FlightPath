name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: flightpath
          POSTGRES_PASSWORD: flightpath
          POSTGRES_DB: flightpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightpath -d flightpath_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: api
      - run: go build ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://flightpath:flightpath@localhost:5432/flightpath_test?sslmode=disable
      - run: go run ./cmd/api openapi > /dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/api openapi > ../web/openapi.json
        working-directory: api
      - name: generated client matches the api
        run: |
          OPENAPI=openapi.json pnpm api
          rm openapi.json
          git diff --exit-code -- src/lib/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: server smoke test
        run: |
          node server.mjs &
          curl -sf --retry 10 --retry-delay 1 --retry-all-errors http://localhost:3000/healthz
          kill %1

  image:
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      matrix:
        context: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
